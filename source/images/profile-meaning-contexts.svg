<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Profile 到底是什么意思</title>
  <desc id="desc">Profile 在 User、Build 和 Distribution 三种技术语境中的不同含义。</desc>
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F1" stop-opacity="0.97"/>
      <stop offset="0.62" stop-color="#F4F6F1" stop-opacity="0.87"/>
      <stop offset="1" stop-color="#E8EEEA" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E948A"/>
      <stop offset="1" stop-color="#286B66"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183B40" flood-opacity="0.12"/>
    </filter>
  </defs>
  <image href="profile-meaning-contexts-background.webp" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#mist)"/>

  <text x="92" y="115" fill="#183B40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="62" font-weight="750">Profile 到底是什么意思？</text>
  <text x="96" y="171" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="29">同一个词，在不同语境里描述不同对象</text>
  <rect x="96" y="201" width="106" height="6" rx="3" fill="#2E948A"/>

  <g filter="url(#shadow)">
    <rect x="92" y="276" width="446" height="408" rx="28" fill="#FBFCFA" stroke="#D4DFDC" stroke-width="2"/>
    <rect x="577" y="276" width="446" height="408" rx="28" fill="#FBFCFA" stroke="#D4DFDC" stroke-width="2"/>
    <rect x="1062" y="276" width="446" height="408" rx="28" fill="#DCEFEB" stroke="#2E948A" stroke-width="3"/>
  </g>

  <circle cx="145" cy="335" r="26" fill="#E8EEEA"/>
  <text x="145" y="344" text-anchor="middle" fill="#286B66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25" font-weight="700">U</text>
  <text x="185" y="345" fill="#183B40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="35" font-weight="720">User Profile</text>
  <text x="132" y="405" fill="#2E948A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="650">用户资料</text>
  <line x1="132" y1="438" x2="498" y2="438" stroke="#D4DFDC" stroke-width="2"/>
  <text x="132" y="490" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">Cookie、历史、扩展、偏好</text>
  <text x="132" y="543" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">所有者：浏览器用户</text>
  <text x="132" y="596" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">变化：日常使用中</text>
  <rect x="132" y="628" width="170" height="34" rx="17" fill="#E8EEEA"/>
  <text x="217" y="652" text-anchor="middle" fill="#356439" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="650">跟着用户走</text>

  <circle cx="630" cy="335" r="26" fill="#E8EEEA"/>
  <text x="630" y="344" text-anchor="middle" fill="#286B66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25" font-weight="700">B</text>
  <text x="670" y="345" fill="#183B40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="35" font-weight="720">Build Profile</text>
  <text x="617" y="405" fill="#2E948A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="650">构建方案</text>
  <line x1="617" y1="438" x2="983" y2="438" stroke="#D4DFDC" stroke-width="2"/>
  <text x="617" y="490" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">Debug、符号、优化、输出</text>
  <text x="617" y="543" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">所有者：构建工程</text>
  <text x="617" y="596" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">变化：选择构建档位时</text>
  <rect x="617" y="628" width="185" height="34" rx="17" fill="#E8EEEA"/>
  <text x="709" y="652" text-anchor="middle" fill="#356439" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="650">跟着构建任务走</text>

  <circle cx="1115" cy="335" r="26" fill="url(#teal)"/>
  <text x="1115" y="344" text-anchor="middle" fill="#F2F7F2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25" font-weight="700">D</text>
  <text x="1155" y="345" fill="#183B40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="33" font-weight="720">Distribution Profile</text>
  <text x="1102" y="405" fill="#286B66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="650">产品交付配置</text>
  <line x1="1102" y1="438" x2="1468" y2="438" stroke="#AFCFC9" stroke-width="2"/>
  <text x="1102" y="490" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24">身份、target、Runtime、更新</text>
  <text x="1102" y="543" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">所有者：产品与发行工程</text>
  <text x="1102" y="596" fill="#4D676B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="25">变化：开发或发版时</text>
  <rect x="1102" y="628" width="186" height="34" rx="17" fill="#C8E4DE"/>
  <text x="1195" y="652" text-anchor="middle" fill="#286B66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="680">跟着产品版本走</text>

  <rect x="92" y="748" width="1416" height="78" rx="24" fill="#183B40" opacity="0.94"/>
  <text x="800" y="798" text-anchor="middle" fill="#F2F7F2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="27" font-weight="650">先看 Profile 描述的是谁，再决定它是什么意思</text>
</svg>
